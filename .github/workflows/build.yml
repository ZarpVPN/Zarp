name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*', '*_Pre-release_*']
  pull_request:
  workflow_dispatch:

permissions:
  actions: read       # SignPath: получить артефакт сборки
  contents: write      # публикация релиза
  id-token: write      # attestation: подтверждение, что exe собран здесь
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Require release signing configuration
        if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "SIGNPATH_ENABLED is true but $name is missing. Complete docs/code-signing.md or disable SIGNPATH_ENABLED."
            }
          }

      - name: Fetch zapret2
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/fetch-zapret.ps1

      - name: Fetch sing-box
        shell: powershell
        run: ./tools/fetch-singbox.ps1

      - name: Fetch Xray
        shell: powershell
        run: ./tools/fetch-xray.ps1

      - name: Version
        id: ver
        shell: pwsh   # pwsh пишет GITHUB_OUTPUT в UTF-8 (Windows PowerShell 5 - в UTF-16)
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v') -replace '_Pre-release_(\d+)$', '-pre.$1'
          } else {
            $v = '0.0.0-dev.${{ github.run_number }}'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build src/Zarp/Zarp.csproj -c Release -o out "-p:Version=${{ steps.ver.outputs.version }}"

      - name: Build regression tests
        run: dotnet build tests/Zarp.Tests/Zarp.Tests.csproj -c Release -o build/tests "-p:Version=${{ steps.ver.outputs.version }}"

      - name: Run regression tests
        id: regression_tests
        timeout-minutes: 15
        run: ./build/tests/Zarp.Tests.exe --results ./build/test-results

      - name: Publish test summary
        if: always() && steps.regression_tests.outcome != 'skipped'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath build/test-results/summary.md) {
            Get-Content -LiteralPath build/test-results/summary.md -Raw |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload test results and diagnostics
        if: always() && steps.regression_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: zarp-test-results
          path: build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Check unsigned release rejection
        shell: pwsh
        run: |
          try {
            ./tools/verify-signature.ps1 -Path out/Zarp.exe
            throw 'Unsigned binary was accepted'
          } catch {
            if ($_.Exception.Message -notlike 'Release signature is not valid: NotSigned.*') { throw }
            Write-Output 'Unsigned release correctly rejected'
          }

      - name: Upload signing input
        if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Zarp-signing-input
          path: out/Zarp.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign release
        if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify and stage signed release
        if: github.ref_type == 'tag' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          ./tools/verify-signature.ps1 -Path signed/Zarp.exe
          Copy-Item -LiteralPath signed/Zarp.exe -Destination out/Zarp.exe -Force

      - name: SHA-256
        id: sha
        shell: pwsh
        run: |
          $h = (Get-FileHash out/Zarp.exe -Algorithm SHA256).Hash.ToLower()
          "hash=$h" >> $env:GITHUB_OUTPUT
          "SHA-256: $h" >> $env:GITHUB_STEP_SUMMARY

      # Attestation подтверждает происхождение окончательного файла; Authenticode — его издателя.
      # gh attestation verify Zarp.exe --repo <owner>/<repo>
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/Zarp.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Zarp
          path: out/Zarp.exe
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Zarp.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            ${{ vars.SIGNPATH_ENABLED == 'true' && 'This release is Authenticode-signed. Verify the publisher in the Digital Signatures tab.' || 'This release is unsigned. Windows SmartScreen may show an unknown-publisher warning.' }}

            **Zarp.exe SHA-256:** `${{ steps.sha.outputs.hash }}`

            Check that the file was built by GitHub Actions from this repository:
            `gh attestation verify Zarp.exe --repo ${{ github.repository }}`

            [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy)

            **Third-party software inside Zarp.exe.** Zarp's own code is MIT. The file also carries unmodified upstream programs: zapret2 with WinDivert and the Cygwin DLL (MIT, LGPL-3.0), sing-box with Wintun (GPL-3.0-or-later) and Xray-core (MPL-2.0, with GPL-3.0-or-later modules inside). Versions, license texts and the places to get their source code are in [THIRD_PARTY_NOTICES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/THIRD_PARTY_NOTICES.md). The same texts are in the program: Settings, Licenses.
